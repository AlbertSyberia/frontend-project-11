<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/src/style.css" rel="stylesheet">
    <title>RSS-агрегатор</title>
  </head>
  <body>
    <main class="container mx-auto px-4 py-8">
      <section class="aggregator grid gap-6">
        <div>
          <h1 class="text-4xl font-bold tracking-tight">RSS агрегатор</h1>
          <p class="mt-3 text-gray-600">Начните читать RSS сегодня! Это легко, это красиво.</p>
        </div>

        <form class="flex flex-col gap-4 sm:flex-row sm:items-start">
          <div class="w-full sm:w-auto flex flex-col sm:flex-row gap-3">
            <div class="flex-1 flex flex-col">
              <label for="rss-link" class="block font-medium text-sm text-gray-700 mb-1">
                Ссылка RSS
              </label>
              <input type="text" id="rss-link" name="rss-link" placeholder="Ссылка RSS" required class="rounded border px-3 py-2 focus:ring-2 focus:ring-sky-500 focus:outline-none">
            </div>
            <button type="submit" class="w-full rounded bg-sky-500 text-white hover:bg-sky-600 px-4 py-2 font-medium">
              Добавить
            </button>
          </div>
        </form>

        <div class="message">
          <div class="status text-sm"></div>
        </div>
      </section>

      <section class="posts mt-8 space-y-3 rounded border p-4">
        <h2 class="font-bold text-lg">Посты</h2>
        <ul class="posts-list"></ul>
      </section>

      <section class="feeds mt-8 space-y-3 rounded border p-4">
        <h2 class="font-bold text-lg">Фиды</h2>
        <div class="feeds-list"></div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
