<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/src/style.css" rel="stylesheet">
    <title>RSS-агрегатор</title>
  </head>
  <body class="bg-gray-50 text-gray-800">

    <section class="handler bg-[#1a1a2e] text-white p-10">

      <div class="max-w-5xl mx-auto px-4">

        <h1 class="text-4xl font-bold mb-2">RSS агрегатор</h1>
        <p class="text-gray-400 mb-6">Начните читать RSS сегодня! Это легко, это красиво.</p>
        
        <div class="flex flex-col md:flex-row gap-4 items-center">
          <form class="flex flex-col md:flex-row gap-2 items-center w-full">
            <label for="rss-input" class="block text-sm font-medium text-white whitespace-nowrap">Ссылка RSS</label>
            <input type="text" id="rss-input" class="text-gray-700 flex-1 px-3 py-2 rounded border border-gray-400 focus:outline-none focus:border-blue-500" placeholder="Cсылка RSS" required />
            <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition">Добавить</button>
          </form>
        </div>

        <div class="mt-4">
          <p class="text-gray-300">Пример: https://lorem-rss.hexlet.app/feed</p>
        </div>

        <div class="message mt-4">
          <p class="message-text font-medium"></p>
        </div>

      </div>
    </section>

    <section class="content max-w-5xl mx-auto px-4 py-8 invisible">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <div class="posts bg-white p-6 rounded-lg shadow-sm border border-gray-200">
          <h2 class="text-xl font-bold mb-4 text-gray-800">Посты</h2>
        </div>

        <div class="feeds bg-white p-6 rounded-lg shadow-sm border border-gray-200 flex flex-col">
          <h2 class="text-lg font-bold mb-3 text-gray-800">Фиды</h2>
        </div>

      </div>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
